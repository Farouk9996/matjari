<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجري</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#0b2a5b;--gd:#d4a72c;--btn:linear-gradient(135deg,#0b2a5b,#164a96);--hd:#fff;--bd:#dde1e6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171a;--card:#1e2226;--tx:#eef0f2;--mu:#9aa;--bd:#333a40;--ac:#e3b93f;--btn:linear-gradient(135deg,#d4a72c,#f0cd62)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.w{max-width:520px;margin:auto;padding:12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:1.3rem;margin:0 0 10px;text-align:center}.img{aspect-ratio:1;background:var(--bg);border:2px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mu);overflow:hidden}
.th{display:flex;gap:8px;margin-top:8px}.th img{flex:1;min-width:0;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}.img img{width:100%;height:100%;object-fit:cover}ul{padding-inline-start:20px;margin:6px 0}
label{display:block;font-weight:bold;margin:10px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:flex;gap:8px}.r>label{flex:1;border:1px solid var(--bd);border-radius:10px;padding:10px;font-weight:normal;margin:0;text-align:center;cursor:pointer}
.r input{width:auto;margin-inline-end:4px}.sum{background:var(--bg);border-radius:10px;padding:10px;margin-top:12px}.sum div{display:flex;justify-content:space-between}
.t{font-weight:bold;font-size:1.15rem;color:var(--ac)}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:bold 1.05rem inherit;cursor:pointer}
.s{background:#0b2a5b;padding:7px 10px;font-size:.85rem;width:auto;margin:4px 0 0}.o{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.b{display:inline-block;padding:1px 8px;border-radius:8px;font-size:.8rem;background:#e8a317;color:#000}.b.ok{background:#0a7d4f;color:#fff}.b.no{background:#c33;color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{margin:0;padding:8px;font-size:.9rem;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
a{color:var(--ac)}.hide{display:none}.msg{text-align:center;color:var(--ac);font-weight:bold}
body{background:linear-gradient(180deg,#e9eef7 0,var(--bg) 260px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body{background:linear-gradient(180deg,#1a2438 0,var(--bg) 260px)}}
.hd{background:var(--hd);border-radius:0 0 22px 22px;border-bottom:4px solid var(--gd);box-shadow:0 6px 18px rgba(11,42,91,.18);padding:8px;margin:-12px -12px 14px;text-align:center}
.hd img{max-width:260px;width:80%;border-radius:12px;display:block;margin:auto}
.c{border-top:3px solid var(--gd);box-shadow:0 3px 10px rgba(11,42,91,.08)}
h1{color:var(--ac)}b{color:var(--ac)}
button{background:var(--btn);box-shadow:0 4px 12px rgba(11,42,91,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button{color:#111}}
.r label:has(input:checked){border-color:var(--gd);background:rgba(212,167,44,.14);font-weight:bold}
.tabs button.on{background:var(--btn)}
